<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Sitio GitHub Pages</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 480px;
      width: 100%;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: #94a3b8; }
    button {
      margin-top: 16px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #count { font-size: 1.5rem; margin-top: 12px; color: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hola, GitHub Pages 👋</h1>
    <p>Sitio básico publicado desde mi repo.</p>
    <button id="btn">Haz clic</button>
    <div id="count">0</div>
  </div>

  <script>
    let count = 0;
    const btn = document.getElementById("btn");
    const out = document.getElementById("count");
    btn.addEventListener("click", () => {
      count++;
      out.textContent = count;
    });
  </script>
</body>
</html>
